# Second, independent stack: the LAUNCH board (board.meta-poo-stall.near).
# The first stack (docker-compose.yml) keeps serving the testing board.
# Its own Valkey data dir and AOF, its own host port, its own .env.launch.
#
# The image is pinned to its own tag, not `:latest`: the testing stack keeps `:latest`, so a
# `docker compose up` on either one cannot silently move the other onto new code.
services:
  valkey:
    image: valkey/valkey:8
    volumes:
      - ./valkey-launch-data:/data
      - ./valkey-launch.conf:/usr/local/etc/valkey/valkey.conf:ro
    command: valkey-server /usr/local/etc/valkey/valkey.conf
    restart: unless-stopped

  indexer:
    image: metapoo-board-server:launch
    command: indexer
    env_file: .env.launch
    environment:
      VALKEY_URL: redis://valkey:6379
    depends_on: [valkey]
    restart: unless-stopped

  server:
    image: metapoo-board-server:launch
    command: server
    env_file: .env.launch
    environment:
      VALKEY_URL: redis://valkey:6379
      LISTEN_ADDR: 0.0.0.0:3000
    ports:
      - "127.0.0.1:3002:3000"
    depends_on: [valkey]
    restart: unless-stopped

  # AWAY-B: the Telegram alerts bot for the launch board. Long polling only: no port, no
  # public endpoint. In the `telegram` profile, so this stack is untouched until the bot
  # exists: `docker compose -f docker-compose.launch.yml --profile telegram up -d`.
  # Token and WALL_URL go in .env.launch. README: "Telegram alerts".
  telegram-bot:
    image: metapoo-board-server:launch
    command: telegram-bot
    profiles: [telegram]
    env_file: .env.launch
    environment:
      VALKEY_URL: redis://valkey:6379
    depends_on: [valkey]
    restart: unless-stopped
