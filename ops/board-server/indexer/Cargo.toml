[package]
name = "indexer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
common = { path = "../common" }
fastnear-neardata-fetcher = "0.38"
fastnear-primitives = "0.38"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dotenvy = "0.15"
signal-hook = "0.3"
