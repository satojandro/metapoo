# Production settings for the Hetzner box (DEPLOY-HETZNER.md). Loaded by
# docker-compose.prod.yml instead of valkey.conf, which it includes first, so the snapshot
# schedule and data dir stay in one place and local / Mini use is unchanged.
include /usr/local/etc/valkey/valkey.conf

# AOF: every write is appended and fsynced once a second, so a crash loses at most ~1 s of
# board, draw log and last_processed_block together (RDB alone: up to 60 s). The RDB
# snapshots from valkey.conf stay on: dump.rdb is what scripts/backup-valkey.sh copies.
appendonly yes
appendfsync everysec

# The whole dataset lives in RAM and draw_history grows with every paint (about 100 bytes a
# tile, DEPLOY-HETZNER.md "How big it gets"). 1 GB is a quarter of the smallest 4 GB box and
# leaves room for the fork that BGSAVE and AOF rewrites make, the two Rust services, Caddy
# and an image build. On a 2 GB box use 512mb.
maxmemory 1gb
# Never evict: every key is either the board, the durable log, a counter the board depends
# on, or a watermark. An evicted key is silent corruption; a refused write is a loud,
# recoverable stall (the consumer retries, /api/health says "degraded", the wall falls back
# to reading the chain). scripts/health-alert.sh warns long before the limit.
maxmemory-policy noeviction
