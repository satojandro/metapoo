[package]
name = "common"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# AWAY-B (Telegram alerts): NEP-413 verification and link codes.
sha2 = "0.10"
ed25519-dalek = "2"
bs58 = "0.5"
base64 = "0.22"
getrandom = "0.2"
