<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meta Poo visual concept</title>
  <style>
    /* One square board, two framings. Paint view crops it; it never stretches. */
    :root {
      --ink: #111114;
      --paper: #f6f3ec;
      --red: #ff3b30;
      --yellow: #ffe500;
      --green: #3ddc6a;
      --blue: #2d5bff;
      --pink: #ff4d9a;
      --cyan: #3ee0ff;
      --board: min(34vw, 46vh);
      --gap: 16px;
      --header: 56px;
      --footer: 64px;
      color: var(--paper);
      background: #16120f;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #120e0c;
      overflow: hidden;
    }

    button, a { font: inherit; color: inherit; }

    body[data-view="overview"] .only-paint,
    body[data-view="overview"] .only-palette,
    body[data-view="paint"] .only-overview,
    body[data-view="paint"] .only-palette,
    body[data-view="palette"] .only-overview,
    body[data-view="palette"] .only-paint { display: none !important; }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      z-index: 5;
    }

    header { min-height: var(--header); }
    footer {
      min-height: var(--footer);
      justify-content: center;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.45));
    }

    .word {
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: 1.35rem;
    }

    .pill, .ghost, .primary {
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(10, 10, 12, 0.72);
      color: white;
      padding: 8px 14px;
    }

    .ghost { margin-left: auto; text-decoration: none; }

    .primary {
      background: var(--cyan);
      color: var(--ink);
      border: 0;
      font-weight: 800;
      padding: 12px 22px;
      box-shadow: 0 0 0 3px rgba(62, 224, 255, 0.25);
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .brick, .floor, .glow {
      position: absolute;
      inset: 0;
    }

    .brick { z-index: 0; }

    .floor {
      top: auto;
      height: 26%;
      z-index: 1;
      background:
        linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.55)),
        repeating-linear-gradient(90deg, #2a241f 0 18px, #241e1b 18px 19px);
    }

    .glow {
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 244, 220, 0.28), transparent 46%);
    }

    /* Side murals are the same bitmaps. A narrow screen crops them. */
    .wall {
      position: absolute;
      top: 0;
      bottom: 0;
      width: calc((100% - var(--board)) / 2);
      z-index: 3;
      overflow: hidden;
    }

    .wall.left { left: 0; }
    .wall.right { right: 0; }

    .wall canvas {
      position: absolute;
      top: 50%;
      width: 100%;
      height: auto;
      transform: translateY(-50%);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .center {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      width: var(--board);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chip {
      margin: 0 0 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(10, 10, 12, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 0.82rem;
    }

    .frame {
      width: 100%;
      aspect-ratio: 1;
      border: 4px solid #b7b2a8;
      box-shadow:
        0 10px 18px rgba(0, 0, 0, 0.45),
        inset 0 0 0 2px #6e6a64;
      background: var(--ink);
      position: relative;
    }

    .frame span {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #eee, #666 60%, #222);
      z-index: 1;
    }

    .frame span:nth-child(1) { top: -3px; left: -3px; }
    .frame span:nth-child(2) { top: -3px; right: -3px; }
    .frame span:nth-child(3) { bottom: -3px; left: -3px; }
    .frame span:nth-child(4) { bottom: -3px; right: -3px; }

    #board {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .gap {
      width: 100%;
      height: var(--gap);
      flex: 0 0 var(--gap);
    }

    .toilet {
      width: 86%;
      height: clamp(150px, 22vh, 190px);
    }

    .toilet svg { width: 100%; height: 100%; display: block; }

    .paint-layout {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px 16px 16px;
    }

    .crop-label { margin: 0; color: #c8c2b8; font-size: 0.85rem; }

    .paint-square {
      position: relative;
      background: var(--ink);
      border: 4px solid #3a342f;
      line-height: 0;
    }

    #paint-board {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .bracket {
      position: absolute;
      pointer-events: none;
      box-sizing: border-box;
    }

    .bracket.selected {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    .bracket.pending {
      outline: 3px dashed var(--paper);
      outline-offset: 3px;
    }

    .dock {
      width: min(920px, 100%);
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
      justify-content: center;
      background: #1b1b1f;
      border-radius: 16px;
      padding: 12px;
    }

    .coord { min-width: 7rem; }
    .coord b { display: block; color: var(--cyan); }

    .swatches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

    .swatch {
      width: 52px;
      background: transparent;
      border: 0;
      color: #ddd;
      font-size: 0.72rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .swatch i {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: block;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .swatch[aria-pressed="true"] i {
      box-shadow: 0 0 0 3px white;
    }

    .palette-sheet {
      height: 100%;
      padding: 42px 48px;
      background: #16161a;
    }

    .palette-sheet h1 { margin: 0 0 6px; font-size: 2.4rem; }
    .palette-sheet .sub { margin: 0 0 28px; color: #c9c3b8; }

    .swatch-row {
      display: flex;
      gap: 18px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .card { width: 92px; }
    .card .chip-color { width: 92px; height: 92px; }
    .card p { margin: 8px 0 0; font-size: 0.95rem; }
    .card code { color: #ddd; font-size: 0.78rem; }

    .sample-block { margin-top: 28px; display: flex; gap: 24px; align-items: center; }
    #palette-sample {
      width: 180px;
      height: 180px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: var(--ink);
    }

    @media (max-width: 700px) {
      :root {
        --board: 58vw;
        --header: 52px;
        --footer: 72px;
      }

      .word { font-size: 1.05rem; }
      .pill, .ghost { padding: 7px 10px; }

      /* Tall wall, inner edge of the same mural. Pixels stay square. */
      .wall canvas {
        top: 0;
        width: auto;
        height: 100%;
        transform: none;
      }

      .wall.left canvas { right: 0; left: auto; }
      .wall.right canvas { left: 0; right: auto; }

      .toilet { height: clamp(180px, 26vh, 230px); }
    }
  </style>
</head>
<body data-view="overview">
  <div class="app only-overview">
    <header>
      <div class="word">Meta Poo</div>
      <span class="pill">testnet</span>
      <a class="ghost" href="#connect">Connect</a>
    </header>
    <div class="stage">
      <canvas class="brick" id="brick"></canvas>
      <div class="wall left"><canvas id="mural-left"></canvas></div>
      <div class="wall right"><canvas id="mural-right"></canvas></div>
      <div class="center">
        <p class="chip">Sample art</p>
        <div class="frame" id="frame">
          <span></span><span></span><span></span><span></span>
          <canvas id="board" width="128" height="128"></canvas>
        </div>
        <div class="gap" id="gap"></div>
        <div class="toilet" id="toilet">
          <svg viewBox="0 0 200 280" aria-label="Toilet">
            <ellipse cx="100" cy="268" rx="78" ry="12" fill="rgba(0,0,0,0.45)" />
            <defs>
              <linearGradient id="ceramic" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#ffffff" />
                <stop offset="0.42" stop-color="#e6e6e1" />
                <stop offset="1" stop-color="#bdbdb6" />
              </linearGradient>
              <linearGradient id="shade" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#f7f7f4" />
                <stop offset="1" stop-color="#c8c8c1" />
              </linearGradient>
            </defs>
            <rect x="46" y="6" width="108" height="86" rx="10" fill="url(#ceramic)" />
            <rect x="58" y="16" width="16" height="48" rx="8" fill="rgba(255,255,255,0.55)" />
            <rect x="88" y="16" width="24" height="10" rx="4" fill="#8e9698" />
            <ellipse cx="100" cy="112" rx="84" ry="26" fill="#f3f3ee" />
            <ellipse cx="100" cy="120" rx="78" ry="20" fill="#d9d9d2" />
            <path d="M28 118 C18 170 36 214 62 230 L138 230 C164 214 182 170 172 118 C150 146 128 156 100 156 C72 156 50 146 28 118 Z" fill="url(#shade)" />
            <ellipse cx="100" cy="156" rx="46" ry="22" fill="#c5d0d4" />
            <ellipse cx="100" cy="154" rx="34" ry="14" fill="#edf3f4" />
            <path d="M78 228 L70 262 L130 262 L122 228 Z" fill="url(#ceramic)" />
          </svg>
        </div>
      </div>
      <div class="floor"></div>
      <div class="glow"></div>
    </div>
    <footer>
      <button class="primary" type="button">Paint the wall</button>
    </footer>
  </div>

  <div class="app only-paint">
    <header>
      <a class="ghost" href="?view=overview" style="margin-left:0">Back to stall</a>
      <div class="word">Meta Poo</div>
      <span class="chip">Sample art — not on chain</span>
    </header>
    <div class="paint-layout">
      <p class="crop-label" id="crop-label"></p>
      <div class="paint-square" id="paint-square">
        <canvas id="paint-board"></canvas>
        <div class="bracket selected" id="sel"></div>
        <div class="bracket pending" id="pend"></div>
      </div>
      <div class="dock">
        <div class="coord"><span id="coord">64, 41</span><b>Cyan</b></div>
        <div class="swatches" id="swatches"></div>
        <button class="primary" type="button">Place</button>
      </div>
    </div>
  </div>

  <div class="only-palette palette-sheet">
    <h1>Proposed palette</h1>
    <p class="sub">Design preview only — not the live chain colors. Indices are 0–7, matching the contract.</p>
    <div class="swatch-row" id="cards"></div>
    <div class="sample-block">
      <canvas id="palette-sample" width="16" height="16"></canvas>
      <p id="sample-note"></p>
    </div>
  </div>

  <script>
    /** Contract indices 0–7. No brown. Brick in the room is scenery, not a swatch. */
    const PALETTE = [
      { index: 0, name: "Ink", hex: "#111114" },
      { index: 1, name: "Paper", hex: "#F6F3EC" },
      { index: 2, name: "Red", hex: "#FF3B30" },
      { index: 3, name: "Yellow", hex: "#FFE500" },
      { index: 4, name: "Green", hex: "#3DDC6A" },
      { index: 5, name: "Blue", hex: "#2D5BFF" },
      { index: 6, name: "Pink", hex: "#FF4D9A" },
      { index: 7, name: "Cyan", hex: "#3EE0FF" },
    ];

    const INK = 0, PAPER = 1, RED = 2, YELLOW = 3, GREEN = 4, BLUE = 5, PINK = 6, CYAN = 7;

    function Grid(width, height) {
      this.width = width;
      this.height = height;
      this.cells = new Uint8Array(width * height);
    }

    Grid.prototype.set = function (x, y, color) {
      if (x < 0 || y < 0 || x >= this.width || y >= this.height) return;
      if (!Number.isInteger(color) || color < 0 || color > 7) {
        throw new Error("Color " + color + " is outside 0–7");
      }
      this.cells[y * this.width + x] = color;
    };

    function rect(g, x, y, w, h, color) {
      for (let yy = y; yy < y + h; yy += 1) {
        for (let xx = x; xx < x + w; xx += 1) g.set(xx, yy, color);
      }
    }

    function disc(g, cx, cy, r, color) {
      for (let y = -r; y <= r; y += 1) {
        for (let x = -r; x <= r; x += 1) {
          if (x * x + y * y <= r * r) g.set(cx + x, cy + y, color);
        }
      }
    }

    function ring(g, cx, cy, r, thick, color) {
      for (let y = -r; y <= r; y += 1) {
        for (let x = -r; x <= r; x += 1) {
          const d = x * x + y * y;
          if (d <= r * r && d >= (r - thick) * (r - thick)) g.set(cx + x, cy + y, color);
        }
      }
    }

    function blit(g, x, y, rows, transparent) {
      rows.forEach(function (row, yy) {
        for (let xx = 0; xx < row.length; xx += 1) {
          const ch = row[xx];
          if (ch === "." || ch === transparent) continue;
          g.set(x + xx, y + yy, Number(ch));
        }
      });
    }

    /** Yellow, ink, and paper only — a mascot the eight swatches can actually paint. */
    const MARK = [
      "..333333..",
      ".33133333.",
      "33.3333.33",
      "3333333333",
      "3333.33333",
      "3333333333",
      ".33333333.",
      "..333333..",
      "...3333...",
      "....33....",
    ];

    function stairs(g, x, y, steps, size, color) {
      for (let i = 0; i < steps; i += 1) {
        rect(g, x + i * size, y + i * Math.max(2, size - 1), size, size, color);
      }
    }

    function star(g, x, y) {
      blit(g, x, y, [
        "....3....",
        "...333...",
        "333333333",
        ".3333333.",
        "..3.3.3..",
        ".3.....3.",
      ]);
    }

    function heart(g, x, y) {
      blit(g, x, y, [
        ".22...22.",
        "2222.2222",
        "222222222",
        ".2222222.",
        "..22222..",
        "...222...",
        "....2....",
      ]);
    }

    function gridPatch(g, x, y, n, color) {
      for (let yy = 0; yy < n; yy += 1) {
        for (let xx = 0; xx < n; xx += 1) {
          if (xx % 3 === 0 || yy % 3 === 0) g.set(x + xx, y + yy, color);
        }
      }
    }

    function block3d(g, x, y, w, h) {
      rect(g, x + 2, y, w, 4, PAPER);
      rect(g, x, y + 4, w, h, RED);
      rect(g, x + w, y + 6, 4, h - 2, BLUE);
      rect(g, x + w, y + 2, 4, 4, PAPER);
    }

    function zigzag(g, x, y, span, color) {
      for (let i = 0; i < span; i += 1) {
        const yy = y + (i % 8 < 4 ? i % 4 : 4 - (i % 4));
        g.set(x + i, yy, color);
        g.set(x + i, yy + 1, color);
      }
    }

    function confetti(g, seed, x0, y0, x1, y1) {
      let n = seed;
      const colors = [BLUE, CYAN, PINK, YELLOW, PAPER];
      for (let i = 0; i < 70; i += 1) {
        n = (n * 1103515245 + 12345) >>> 0;
        const x = x0 + (n % (x1 - x0));
        n = (n * 1103515245 + 12345) >>> 0;
        const y = y0 + (n % (y1 - y0));
        if (g.cells[y * g.width + x] !== INK) continue;
        rect(g, x, y, 2, 2, colors[i % colors.length]);
      }
    }

    function chalk(g, x, y, color) {
      const pts = [[0, 0], [2, 2], [4, 1], [7, 4], [9, 3], [12, 7], [14, 6], [16, 10], [18, 8]];
      pts.forEach(function (p) {
        g.set(x + p[0], y + p[1], color);
        g.set(x + p[0], y + p[1] + 1, color);
      });
    }

    /** Wide mural. Columns 0–15 of the right wall and the last 16 of the left wall sit beside the board. */
    function drawMural(side) {
      const g = new Grid(96, 150);
      confetti(g, side === "left" ? 3 : 9, 0, 0, 96, 150);
      if (side === "left") {
        disc(g, 28, 32, 18, YELLOW);
        blit(g, 22, 26, ["....1....", "...111...", "....1....", "1...1...1", "....1...."]);
        stairs(g, 6, 58, 9, 5, CYAN);
        ring(g, 30, 96, 12, 3, PINK);
        zigzag(g, 8, 118, 28, PAPER);
        block3d(g, 8, 128, 16, 12);
        gridPatch(g, 58, 14, 22, GREEN);
        stairs(g, 62, 46, 8, 4, CYAN);
        rect(g, 70, 78, 10, 10, PINK);
        rect(g, 84, 76, 8, 8, BLUE);
        heart(g, 64, 96);
        blit(g, 72, 112, MARK);
        chalk(g, 60, 132, PAPER);
        disc(g, 88, 40, 6, PAPER);
      } else {
        disc(g, 70, 36, 18, YELLOW);
        blit(g, 64, 30, ["....1....", "...111...", "....1....", "1...1...1", "....1...."]);
        stairs(g, 48, 62, 8, 5, CYAN);
        ring(g, 68, 100, 11, 3, PINK);
        zigzag(g, 46, 122, 30, PAPER);
        block3d(g, 50, 132, 14, 10);
        gridPatch(g, 8, 12, 24, GREEN);
        block3d(g, 10, 44, 18, 14);
        stairs(g, 6, 72, 7, 4, CYAN);
        rect(g, 8, 100, 12, 12, PINK);
        rect(g, 24, 104, 8, 8, BLUE);
        heart(g, 12, 118);
        blit(g, 8, 128, MARK);
        chalk(g, 4, 108, PAPER);
      }
      return g;
    }

    function drawBoard() {
      const g = new Grid(128, 128);
      confetti(g, 11, 0, 0, 128, 128);
      blit(g, 24, 30, MARK);
      stairs(g, 70, 18, 8, 4, CYAN);
      star(g, 96, 22);
      heart(g, 86, 56);
      rect(g, 46, 72, 14, 8, GREEN);
      rect(g, 62, 78, 6, 6, GREEN);
      rect(g, 102, 86, 8, 8, BLUE);
      disc(g, 64, 100, 6, PINK);
      zigzag(g, 18, 96, 22, PAPER);
      ring(g, 108, 48, 7, 2, CYAN);
      // These two cells are the paint-view selection and pending examples.
      g.set(34, 40, CYAN);
      g.set(36, 42, PINK);
      return g;
    }

    function paintGrid(canvas, grid, scale) {
      canvas.width = grid.width * scale;
      canvas.height = grid.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      for (let y = 0; y < grid.height; y += 1) {
        for (let x = 0; x < grid.width; x += 1) {
          ctx.fillStyle = PALETTE[grid.cells[y * grid.width + x]].hex;
          ctx.fillRect(x * scale, y * scale, scale, scale);
        }
      }
    }

    /** Reject any pixel that is not an exact proposed swatch. */
    function assertPaletteOnly(canvas) {
      const ctx = canvas.getContext("2d");
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const allowed = new Set(PALETTE.map(function (swatch) {
        const n = parseInt(swatch.hex.slice(1), 16);
        return ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255);
      }));
      for (let i = 0; i < data.length; i += 4) {
        const key = data[i] + "," + data[i + 1] + "," + data[i + 2];
        if (!allowed.has(key)) {
          throw new Error("Off-palette pixel " + key);
        }
      }
    }

    function drawBrick(canvas) {
      const w = 480;
      const h = 320;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#5c564e";
      ctx.fillRect(0, 0, w, h);
      const bw = 46;
      const bh = 18;
      let n = 7;
      for (let y = 2; y < h; y += bh + 4) {
        const offset = ((y / (bh + 4)) | 0) % 2 === 0 ? 0 : 24;
        for (let x = -bw + offset; x < w; x += bw + 4) {
          n = (n * 17 + 3) % 20;
          const shade = 28 + n;
          ctx.fillStyle = "rgb(" + (shade + 8) + "," + shade + "," + (shade - 2) + ")";
          ctx.fillRect(x, y, bw, bh);
        }
      }
    }

    function paintCrop(board) {
      const narrow = window.matchMedia("(max-width: 700px)").matches;
      const cols = 18;
      const rows = 18;
      const cell = narrow ? 18 : 22;
      const originX = 20;
      const originY = 26;
      const canvas = document.getElementById("paint-board");
      canvas.width = cols * cell;
      canvas.height = rows * cell;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      for (let y = 0; y < rows; y += 1) {
        for (let x = 0; x < cols; x += 1) {
          const color = board.cells[(originY + y) * board.width + (originX + x)];
          ctx.fillStyle = PALETTE[color].hex;
          ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }
      function place(el, cellX, cellY) {
        el.style.left = (cellX - originX) * cell + "px";
        el.style.top = (cellY - originY) * cell + "px";
        el.style.width = cell + "px";
        el.style.height = cell + "px";
      }
      place(document.getElementById("sel"), 34, 40);
      place(document.getElementById("pend"), 36, 42);
      document.getElementById("crop-label").textContent =
        "18×18 crop of the 128×128 board · " + cell + " px cells";
      document.getElementById("coord").textContent = "34, 40";
    }

    function renderPalette(board) {
      const cards = document.getElementById("cards");
      PALETTE.forEach(function (swatch) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
          '<div class="chip-color" style="background:' + swatch.hex + '"></div>' +
          "<p>" + swatch.index + " " + swatch.name + "</p><code>" + swatch.hex + "</code>";
        cards.appendChild(card);
      });
      const sample = new Grid(16, 16);
      blit(sample, 3, 1, MARK);
      rect(sample, 1, 12, 4, 4, GREEN);
      rect(sample, 12, 12, 3, 3, CYAN);
      paintGrid(document.getElementById("palette-sample"), sample, 1);
      assertPaletteOnly(document.getElementById("palette-sample"));
      document.getElementById("sample-note").textContent =
        "Sample pixels use only these eight swatches. The mark is Yellow, Ink, and Paper — there is no brown in this proposal.";
    }

    function renderSwatches() {
      const row = document.getElementById("swatches");
      PALETTE.forEach(function (swatch) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "swatch";
        button.setAttribute("aria-pressed", swatch.name === "Cyan" ? "true" : "false");
        button.innerHTML = "<i style=\"background:" + swatch.hex + "\"></i>" + swatch.name;
        row.appendChild(button);
      });
    }

    function metrics() {
      const board = document.getElementById("frame").getBoundingClientRect();
      const toilet = document.getElementById("toilet").getBoundingClientRect();
      return {
        boardWidth: Math.round(board.width),
        boardHeight: Math.round(board.height),
        gap: Math.round(toilet.top - board.bottom),
        square: Math.abs(board.width - board.height) < 1.5,
      };
    }

    const params = new URLSearchParams(location.search);
    document.body.dataset.view = params.get("view") || "overview";

    const board = drawBoard();
    paintGrid(document.getElementById("board"), board, 1);
    assertPaletteOnly(document.getElementById("board"));
    paintGrid(document.getElementById("mural-left"), drawMural("left"), 4);
    paintGrid(document.getElementById("mural-right"), drawMural("right"), 4);
    assertPaletteOnly(document.getElementById("mural-left"));
    assertPaletteOnly(document.getElementById("mural-right"));
    drawBrick(document.getElementById("brick"));
    const brick = document.getElementById("brick");
    brick.style.width = "100%";
    brick.style.height = "100%";
    paintCrop(board);
    renderSwatches();
    renderPalette(board);
    window.__metrics = metrics;
    window.__paletteCount = PALETTE.length;
  </script>
</body>
</html>
