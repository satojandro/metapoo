<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111214" />
    <meta
      name="description"
      content="A public tile wall on NEAR. Paint tiles with credits, paint over anyone's, and every stroke is recorded on chain."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Share card. The origin comes from VITE_SITE_URL at build time, so moving domain is
      one variable rather than an edit here — and the build fails if it is unset, because
      a crawler cannot resolve a relative og:image.
      One card covers every route: a tab title set in the client (main.ts) does
      not change a share preview, and per-route cards would need prerendering.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Meta Poo" />
    <meta
      property="og:description"
      content="A public tile wall on NEAR. Paint tiles with credits, paint over anyone's, and every stroke is recorded on chain."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meta Poo" />
    <meta
      name="twitter:description"
      content="A public tile wall on NEAR. Paint tiles with credits, paint over anyone's, and every stroke is recorded on chain."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
    <title>Meta Poo</title>
  </head>
  <body>
    <!--
      App shell mounts into #app (nav, global wallet/ops, page outlet).
      Deep links (/wall, /bounties/:id, …) require the host to serve index.html
      for unknown paths (Vite dev does this; configure production similarly).
    -->
    <div id="app" class="app-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
