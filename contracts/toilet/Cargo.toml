[package]
name = "metapoo-toilet"
version = "0.1.0"
edition = "2021"
publish = false
description = "Capped TOILET token with emitter-gated issuance and explicit venue tax"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

