[package]
name = "metapoo-bounties"
version = "0.1.0"
edition = "2021"
publish = false
description = "Meta Poo art-bounty escrow. MPOO deposits are escrow liabilities, never paint revenue."

[lib]
# cdylib is the WASM bundle NEAR would run. rlib lets `cargo test` call the code on this computer.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Version mirrors contracts/board (near-sdk 5.29.1).
near-sdk = "5.29.1"
hex = "0.4"

[features]
# Host `cargo test` uses the mock VM. The wasm32 sandbox build passes
# `--no-default-features` so that mock runner is not linked into the chain binary.
default = ["unit-testing"]
unit-testing = ["near-sdk/unit-testing"]

[dev-dependencies]
serde_json = "1"
# Local NEAR sandbox (not testnet, not mainnet) for T2.DE / T2.EDH.
near-workspaces = "0.24.0-rc.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sha2 = "0.10"
hex = "0.4"
