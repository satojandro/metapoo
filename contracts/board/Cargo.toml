[package]
name = "metapoo-board"
version = "0.1.0"
edition = "2021"
publish = false
description = "Meta Poo Open wall board contract. Sparse pixels; any caller may draw in-range cells."

[lib]
# cdylib is the WASM bundle NEAR would run. rlib lets `cargo test` call the code on this computer.
crate-type = ["cdylib", "rlib"]

[dependencies]
# unit-testing lets `cargo test` run on this computer. A real WASM deploy later
# should use `cargo near build` / the wasm32 target, not this host test path.
near-sdk = { version = "5.29.1", features = ["unit-testing"] }

[dev-dependencies]
serde_json = "1"
