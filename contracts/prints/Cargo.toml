[package]
name = "metapoo-prints"
version = "0.1.0"
edition = "2021"
publish = false
description = "Meta Poo snapshot registry and numbered historical print NFT issuance."

[lib]
# cdylib is the WASM bundle NEAR would run. rlib lets `cargo test` call the code on this computer.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Version mirrors contracts/board and contracts/bounties (near-sdk 5.29.1).
near-sdk = "5.29.1"
hex = "0.4"

[features]
# Host `cargo test` uses the mock VM. The wasm32 sandbox build passes
# `--no-default-features` so that mock runner is not linked into the chain binary.
default = ["unit-testing"]
unit-testing = ["near-sdk/unit-testing"]

[dev-dependencies]
serde_json = "1"
