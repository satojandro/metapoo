# Sandbox simulation for the staking contract against the real board and token wasm.
# A separate package with its own lockfile, so the contract crate's dependency tree (and
# its deployed wasm) never sees near-workspaces.
[package]
name = "metapoo-toilet-staking-sim"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
near-workspaces = "=0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
