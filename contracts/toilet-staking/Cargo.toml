[package]
name = "metapoo-toilet-staking"
version = "0.1.0"
edition = "2021"
publish = false
description = "TOILET staking: releases at most 10% of its mPOO pool per day to stakers and burns a 10% exit tax. No owner, no upgrade."

[lib]
# cdylib is the WASM bundle NEAR would run. rlib lets `cargo test` call the code on this computer.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same pins as contracts/toilet. Release builds (the deployed WASM) must NOT enable
# `unit-testing`: that pulls in the host test harness and inflates the contract.
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"

[dev-dependencies]
# `unit-testing` gives `cargo test` a simulated chain on this computer.
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
